<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Kartenwerkzeug</title>
  </head>
  <body>
    <h1>Kartenwerkzeug</h1>

    <label>
      Breite
      <input type="range" id="breite" min="200" max="1400" value="720" />
    </label>

    <label>
      Zoom
      <input type="range" id="zoom" min="0" max="7" step="0.01" value="0" />
    </label>

    <label>
        Radius
        <input type="range" id="radius" min="0" max="20000" step="10" value="20000" />
        <span id="radiusAnzeige"></span> km
    </label>

    <div id="karte"></div>
    
    <ol id="liste"></ol>

    <script type="module" src="karte.js"></script>
  </body>
</html>
